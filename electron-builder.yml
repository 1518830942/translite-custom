appId: com.translite.app
productName: Translite
directories:
  output: release
  buildResources: build
files:
  - 'out/main/**/*'
  - 'out/preload/**/*'
  - 'out/renderer/**/*'
  - 'package.json'
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/tray-icon.png
    to: tray-icon.png
win:
  extraResources:
    - from: build/selection-copy.exe
      to: selection-copy.exe
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: translite-custom-${version}-win-x64-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: true
  shortcutName: ${productName}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
