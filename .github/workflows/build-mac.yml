name: Build Apple Silicon macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and platform behavior
        run: |
          pnpm typecheck
          node scripts/test-mac-shortcuts.cjs
          node scripts/test-phonetics.cjs
      - name: Build arm64 DMG and ZIP
        run: pnpm build:mac
      - name: Verify arm64 payload and create checksums
        run: |
          APP="release/mac-arm64/Translite.app"
          test -d "$APP"
          lipo "$APP/Contents/MacOS/Translite" -verify_arch arm64
          lipo "$APP/Contents/Resources/selection-copy-macos" -verify_arch arm64
          test -x "$APP/Contents/Resources/selection-copy-macos"
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Translite" -e 'if (process.arch !== "arm64") process.exit(1); console.log("Packaged arm64 runtime started")'
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: translite-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-mac.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: translite-mac-arm64
          path: release
      - name: Publish macOS test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" release/*.dmg release/*.zip release/SHA256SUMS-mac.txt \
            --target "$GITHUB_SHA" --title "v$VERSION · Apple 芯片 Mac 测试版" \
            --notes-file docs/releases/mac-install.md --prerelease --latest=false
